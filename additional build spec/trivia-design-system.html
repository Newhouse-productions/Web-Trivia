<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trivia night — design system</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   Trivia night — design tokens
   One typeface, Archivo variable. Width encodes role:
     62%  narrow uppercase  → labels, eyebrows, metadata
     100% normal            → body, prompts, options
     125% expanded, 800     → display, big screen, scores
   ========================================================================== */

:root {
  /* --- theme tokens: the only values a theme may override --- */
  --bg:               #10151F;
  --bg2:              #17202E;
  --surface:          #1B2432;
  --surface-selected: #2D3B50;
  --text:             #F2F0EA;
  --text-muted:       #8D98A8;
  --border:           #2E3A4C;
  --accent:           #E8A33D;
  --accent-text:      #16191C;

  /* --- semantic, derived from theme, never themed directly --- */
  --correct:          #4E9E6A;
  --wrong:            #C4593C;
  --pending:          #8D98A8;

  /* --- type --- */
  --font: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --w-narrow: 62;
  --w-wide: 125;

  /* --- scale: 1.25 ratio, tabular where numbers matter --- */
  --t-label:   0.6875rem;  /* 11px  narrow caps, tracked */
  --t-small:   0.8125rem;  /* 13px */
  --t-body:    1rem;       /* 16px  never smaller on a phone */
  --t-lead:    1.25rem;
  --t-h3:      1.5rem;
  --t-h2:      1.9375rem;
  --t-h1:      2.4375rem;

  /* --- space: 4px base --- */
  --s1: 4px;  --s2: 8px;  --s3: 12px; --s4: 16px;
  --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;

  /* --- form --- */
  --r-tile: 10px;
  --r-chip: 999px;
  --tap: 44px;
  --seat: inset 0 2px 0 rgba(0,0,0,.35);
  --lift: 0 1px 0 rgba(255,255,255,.05), 0 2px 8px rgba(0,0,0,.28);
}

[data-theme="light"] {
  --bg:               #EFEBE2;
  --bg2:              #E5E0D5;
  --surface:          #F8F6F1;
  --surface-selected: #E2DACA;
  --text:             #16191C;
  --text-muted:       #6B6357;
  --border:           #CFC7B8;
  --accent:           #9A5B18;
  --accent-text:      #FFFFFF;
  --correct:          #2F6B45;
  --wrong:            #973C22;
}

/* ==========================================================================
   Primitives
   ========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

.tn {
  font-family: var(--font);
  font-variation-settings: 'wdth' 100;
  color: var(--text);
  font-size: var(--t-body);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

/* width-as-role */
.label {
  font-variation-settings: 'wdth' var(--w-narrow), 'wght' 600;
  font-size: var(--t-label);
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.display {
  font-variation-settings: 'wdth' var(--w-wide), 'wght' 800;
  letter-spacing: -.015em;
  line-height: 1.08;
}
.num { font-variant-numeric: tabular-nums; font-feature-settings: 'tnum'; }

.muted { color: var(--text-muted); }
.stack > * + * { margin-top: var(--s3); }

/* ==========================================================================
   Signature: the tile
   Everything on every surface is a tile on a board.
   ========================================================================== */

.tile {
  display: flex;
  align-items: center;
  gap: var(--s3);
  min-height: var(--tap);
  padding: var(--s3) var(--s4);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-tile);
  color: var(--text);
  font: inherit;
  font-size: var(--t-body);
  text-align: left;
  width: 100%;
  cursor: pointer;
  box-shadow: var(--lift);
  transition: background .12s ease, border-color .12s ease, transform .08s ease;
}
.tile:hover { border-color: var(--text-muted); }
.tile:active { transform: translateY(1px); }
.tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* seated = selected. Shape + weight + inset, never colour alone. */
.tile.seated {
  background: var(--surface-selected);
  border-color: var(--text);
  border-width: 2px;
  padding: calc(var(--s3) - 1px) calc(var(--s4) - 1px);
  font-weight: 700;
  box-shadow: var(--seat);
  transform: translateY(1px);
}
.tile[disabled] { cursor: default; opacity: .62; box-shadow: none; }
.tile.flat { box-shadow: none; cursor: default; }

/* letter chip on an option */
.chip {
  flex: none;
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: var(--r-chip);
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-muted);
  font-variation-settings: 'wdth' var(--w-narrow), 'wght' 700;
  font-size: var(--t-small);
}
.tile.seated .chip {
  background: var(--text);
  border-color: var(--text);
  color: var(--bg);
}
.tile .mark { margin-left: auto; flex: none; font-size: var(--t-small); }

/* ==========================================================================
   Buttons
   ========================================================================== */

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
  min-height: var(--tap);
  padding: 0 var(--s5);
  border-radius: var(--r-tile);
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--accent-text);
  font: inherit; font-weight: 700;
  cursor: pointer;
  box-shadow: var(--lift);
  transition: transform .08s ease, filter .12s ease;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(1px); box-shadow: var(--seat); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.wide { width: 100%; }
.btn.ghost { background: transparent; color: var(--text); border-color: var(--border); }
.btn.ghost:hover { border-color: var(--text-muted); }
.btn.danger { background: transparent; color: var(--wrong); border-color: var(--wrong); }
.btn[disabled] { background: var(--surface); border-color: var(--border); color: var(--text-muted); cursor: default; box-shadow: none; }
.btn.sm { min-height: 34px; padding: 0 var(--s3); font-size: var(--t-small); }

kbd {
  font: inherit; font-size: 10px;
  font-variation-settings: 'wdth' var(--w-narrow), 'wght' 600;
  border: 1px solid var(--border); border-bottom-width: 2px;
  border-radius: 4px; padding: 1px 5px;
  color: var(--text-muted); background: var(--bg);
}

/* ==========================================================================
   Form
   ========================================================================== */

.field {
  width: 100%;
  min-height: var(--tap);
  padding: var(--s3) var(--s4);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-tile);
  color: var(--text);
  font: inherit; font-size: var(--t-body);
}
.field::placeholder { color: var(--text-muted); }
.field:focus { outline: 3px solid var(--accent); outline-offset: 2px; border-color: var(--text); }

/* ==========================================================================
   Status — always shape + word, never colour alone
   ========================================================================== */

.status {
  display: inline-flex; align-items: center; gap: var(--s2);
  font-variation-settings: 'wdth' var(--w-narrow), 'wght' 700;
  font-size: var(--t-label); letter-spacing: .1em; text-transform: uppercase;
}
.status::before {
  content: ''; width: 10px; height: 10px; flex: none;
  border: 2px solid currentColor;
}
.status.ok      { color: var(--correct); }
.status.ok::before { border-radius: 50%; background: currentColor; }
.status.bad     { color: var(--wrong); }
.status.bad::before { transform: rotate(45deg); }
.status.wait    { color: var(--pending); }
.status.wait::before { border-radius: 50%; }

/* ==========================================================================
   Team colour band — identity, constant, never the content area
   ========================================================================== */

.band {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--s3);
  padding: var(--s3) var(--s4);
  border-bottom: 1px solid rgba(0,0,0,.35);
  font-variation-settings: 'wdth' 100, 'wght' 700;
}
.band .table-no {
  font-variation-settings: 'wdth' var(--w-narrow), 'wght' 600;
  font-size: var(--t-label); letter-spacing: .12em; text-transform: uppercase;
  opacity: .88;
}

/* ==========================================================================
   Vitals strip — operator surfaces
   ========================================================================== */

.vitals { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: var(--surface); }
.vital { padding: var(--s2) var(--s4); border-right: 1px solid var(--border); flex: 1; min-width: 92px; }
.vital .k { display: block; font-variation-settings: 'wdth' var(--w-narrow), 'wght' 600;
  font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); }
.vital .v { font-variation-settings: 'wdth' 100, 'wght' 700; font-size: var(--t-small); font-variant-numeric: tabular-nums; }
.vital .v.alert { color: var(--accent); }

/* ==========================================================================
   Tally strip — the signature on the big screen and the console.
   30 lozenges that fill as tables answer.
   ========================================================================== */

.tally { display: grid; grid-template-columns: repeat(15, 1fr); gap: 4px; }
.tally .t {
  aspect-ratio: 1 / 1.15;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: transparent;
  display: grid; place-items: center;
  font-variation-settings: 'wdth' var(--w-narrow), 'wght' 700;
  font-size: 10px; color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.tally .t.in { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.tally .t.out { border-color: var(--wrong); color: var(--wrong); }
.tally .t.us { outline: 2px solid var(--text); outline-offset: 1px; }

/* ==========================================================================
   Leaderboard
   ========================================================================== */

.lb { display: flex; flex-direction: column; gap: var(--s2); }
.lb-row {
  display: flex; align-items: center; gap: var(--s3);
  padding: var(--s3) var(--s4);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--r-tile);
}
.lb-row .pos {
  font-variation-settings: 'wdth' var(--w-wide), 'wght' 800;
  font-size: var(--t-lead); font-variant-numeric: tabular-nums;
  color: var(--text-muted); min-width: 1.6em;
}
.lb-row.lead { border-color: var(--accent); border-width: 2px; padding: calc(var(--s3) - 1px) calc(var(--s4) - 1px); }
.lb-row.lead .pos { color: var(--accent); }
.lb-row .swatch { width: 8px; align-self: stretch; border-radius: 3px; flex: none; }
.lb-row .name { flex: 1; font-weight: 600; }
.lb-row .score {
  font-variation-settings: 'wdth' var(--w-wide), 'wght' 800;
  font-size: var(--t-h3); font-variant-numeric: tabular-nums;
}

/* ==========================================================================
   Notices
   ========================================================================== */

.notice {
  padding: var(--s3) var(--s4);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--r-tile);
  background: var(--surface);
  font-size: var(--t-small);
}
.notice.bad { border-left-color: var(--wrong); }
.notice.ok { border-left-color: var(--correct); }

.rule { height: 1px; background: var(--border); border: 0; margin: var(--s4) 0; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

</style>
<style>
/* ---------- page chrome (not part of the shipped system) ---------- */
body { margin:0; background:#0A0D14; color:#F2F0EA; font-family:var(--font); }
.shell { display:grid; grid-template-columns: 244px minmax(0,1fr); min-height:100vh; }
@media (max-width: 900px){ .shell{ grid-template-columns:1fr; } }

.rail { border-right:1px solid #222B3A; padding:20px 0 60px; background:#0C1018; position:sticky; top:0; height:100vh; overflow-y:auto; }
@media (max-width:900px){ .rail{ position:static; height:auto; border-right:0; border-bottom:1px solid #222B3A; } }
.rail h1 { font-variation-settings:'wdth' 125,'wght' 800; font-size:15px; margin:0 20px 2px; letter-spacing:-.01em; }
.rail .v { font-variation-settings:'wdth' 62,'wght' 600; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#6E7A8C; margin:0 20px 18px; }
.grp { font-variation-settings:'wdth' 62,'wght' 600; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#6E7A8C; margin:18px 20px 6px; }
.nav { display:block; width:100%; text-align:left; background:none; border:0; color:#AEB8C6; font:inherit; font-size:13px; padding:7px 20px; cursor:pointer; border-left:2px solid transparent; }
.nav:hover { color:#F2F0EA; background:#111722; }
.nav[aria-current="true"] { color:#F2F0EA; background:#141B27; border-left-color:var(--accent); font-weight:700; }
.nav:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }

.main { padding:22px 26px 80px; max-width:1180px; }
.hdr { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:18px; }
.hdr h2 { font-variation-settings:'wdth' 125,'wght' 800; font-size:24px; margin:0 0 4px; letter-spacing:-.015em; }
.hdr p { margin:0; color:#8D98A8; font-size:13.5px; max-width:60ch; }
.toggles { display:flex; gap:6px; }
.tg { background:transparent; border:1px solid #2B3546; color:#AEB8C6; border-radius:8px; padding:6px 11px; font:inherit; font-size:11.5px; cursor:pointer; }
.tg[aria-pressed="true"]{ background:#F2F0EA; color:#10151F; border-color:#F2F0EA; font-weight:700; }

/* ---------- device frames ---------- */
.frames { display:flex; gap:22px; flex-wrap:wrap; align-items:flex-start; }
.cap { font-variation-settings:'wdth' 62,'wght' 600; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:#6E7A8C; margin-bottom:8px; }
.phone { width:330px; border:1px solid #2B3546; border-radius:26px; padding:9px; background:#161B25; }
.phone .inner { border-radius:19px; overflow:hidden; min-height:600px; display:flex; flex-direction:column; background:var(--bg); }
.bigscreen { width:100%; max-width:880px; aspect-ratio:16/9; border:1px solid #2B3546; border-radius:8px; overflow:hidden; container-type:inline-size; }
.bigscreen.far { max-width:260px; }
.console { width:100%; max-width:880px; border:1px solid #2B3546; border-radius:8px; overflow:hidden; background:var(--bg); }

/* content areas inherit theme tokens */
.pbody { padding:16px; flex:1; display:flex; flex-direction:column; background:linear-gradient(168deg, var(--bg), var(--bg2)); }
.cbody { padding:16px; background:linear-gradient(168deg, var(--bg), var(--bg2)); }
.sbody { width:100%; height:100%; padding:4.5%; position:relative; display:flex; flex-direction:column;
         background:linear-gradient(135deg, var(--bg), var(--bg2)); color:var(--text); }

/* big screen type, container-relative */
.s-eyebrow { font-variation-settings:'wdth' 62,'wght' 700; font-size:2.1cqw; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
.s-prompt  { font-variation-settings:'wdth' 125,'wght' 800; font-size:4.8cqw; line-height:1.12; letter-spacing:-.015em; margin:1.6cqw 0 0; }
.s-prompt.big { font-size:6.4cqw; }
.s-opts { display:grid; grid-template-columns:1fr 1fr; gap:1.3cqw; margin-top:2cqw; }
.s-opt { display:flex; align-items:center; gap:1.2cqw; background:var(--surface); border:1px solid var(--border);
         border-radius:.9cqw; padding:1.4cqw 1.6cqw; font-size:2.9cqw; font-weight:600; }
.s-opt .c { width:3.4cqw; height:3.4cqw; flex:none; display:grid; place-items:center; border-radius:50%;
            border:1px solid var(--border); background:var(--bg); font-variation-settings:'wdth' 62,'wght' 700; font-size:1.8cqw; color:var(--text-muted); }
.s-foot { position:absolute; left:0; right:0; bottom:0; height:7.5cqw; background:var(--surface); border-top:1px solid var(--border);
          display:flex; align-items:center; justify-content:space-between; padding:0 4.5%; color:var(--text-muted); font-size:1.9cqw; }
.s-logo { position:absolute; top:3.2%; right:3.4%; height:5cqw; aspect-ratio:2.4/1; border-radius:.5cqw; background:var(--surface);
          border:1px solid var(--border); display:grid; place-items:center; color:var(--text-muted);
          font-variation-settings:'wdth' 62,'wght' 700; font-size:1.5cqw; letter-spacing:.14em; }
.s-tally { display:grid; grid-template-columns:repeat(15,1fr); gap:.5cqw; margin-top:auto; }
.s-tally .t { aspect-ratio:1/1.15; border-radius:.35cqw; border:1px solid var(--border); }
.s-tally .t.in { background:var(--accent); border-color:var(--accent); }

/* foundations */
.swatches { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.sw { border:1px solid var(--border); border-radius:var(--r-tile); overflow:hidden; background:var(--surface); }
.sw .chip2 { height:56px; }
.sw .meta { padding:8px 10px; }
.sw code { font-size:11px; color:var(--text-muted); }
.specimen { border:1px solid var(--border); border-radius:var(--r-tile); padding:16px; background:var(--surface); }
.gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
.gcard { border:1px solid var(--border); border-radius:var(--r-tile); padding:14px; background:var(--surface); }
.note { color:var(--text-muted); font-size:12.5px; margin-top:8px; }
.themed { background:linear-gradient(168deg,var(--bg),var(--bg2)); border:1px solid var(--border); border-radius:12px; padding:18px; }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <h1>Trivia night</h1>
    <div class="v">Design system · v1</div>
    <nav id="nav"></nav>
  </aside>
  <main class="main tn">
    <div class="hdr">
      <div><h2 id="title"></h2><p id="blurb"></p></div>
      <div class="toggles">
        <button class="tg" id="tTheme" aria-pressed="false">Light theme</button>
        <button class="tg" id="tFar" aria-pressed="false">Back of room</button>
      </div>
    </div>
    <div id="stage"></div>
  </main>
</div>

<script>
/* ============================ helpers ============================ */
const tally = (n, opts={}) => `<div class="${opts.big?'s-tally':'tally'}">${
  Array.from({length:30},(_,i)=>{
    const t=i+1, cls=[];
    if(i<n) cls.push('in');
    if(opts.out && opts.out.includes(t)) cls.push('out');
    if(opts.us===t) cls.push('us');
    return `<div class="t ${cls.join(' ')}">${opts.big?'':t}</div>`;
  }).join('')}</div>`;

const vitals = o => `<div class="vitals">${
  [['Event',o.event||'Winter Quiz'],['Round',o.round||'1 of 3'],['Question',o.q||'4 of 10'],
   ['Marking',o.mark||'1 of 3'],['Tables',o.tables||'30 live'],['Time',o.time||'20:42']]
  .map(([k,v])=>`<div class="vital"><span class="k">${k}</span><span class="v ${o.alert===k?'alert':''}">${v}</span></div>`).join('')}</div>`;

const band = (name='The Quizzards', no='Table 12', col='#C2410C', c2=null) =>
  `<div class="band" style="background:${c2?`linear-gradient(135deg,${col},${c2})`:col};color:#fff">
     <span>${name}</span><span class="table-no num">${no}</span></div>`;

const opt = (letter, text, seated=false, mark='') =>
  `<button class="tile ${seated?'seated':''}"><span class="chip">${letter}</span><span>${text}</span>${mark?`<span class="mark">${mark}</span>`:''}</button>`;

const phone = inner => `<div><div class="cap">Player · phone</div><div class="phone"><div class="inner">${inner}</div></div></div>`;
const big = inner => `<div style="flex:1;min-width:300px"><div class="cap">Big screen · 16:9</div><div class="bigscreen" id="bs"><div class="sbody">${inner}</div></div></div>`;
const con = inner => `<div style="flex:1;min-width:300px"><div class="cap">Operator console</div><div class="console">${inner}</div></div>`;

const foot = `<div class="s-foot"><span>Proudly supported by The Anchor</span><span>#winterquiz</span></div>`;
const logo = `<div class="s-logo">LOGO</div>`;

/* ============================ screens ============================ */
const S = {};

/* ---------- foundations ---------- */
S.foundations = { group:'Foundations', label:'Tokens', title:'Tokens',
  blurb:'Themes may override the nine theme tokens and nothing else. Everything below derives from them, so a round theme recolours every surface without touching a component.',
  render: () => `
  <div class="stack">
    <div class="label">Theme tokens — the only overridable values</div>
    <div class="swatches">
      ${[['--bg','Page'],['--bg2','Gradient end'],['--surface','Tiles, inputs'],['--surface-selected','Seated tile'],
         ['--text','Body'],['--text-muted','Secondary'],['--border','Outlines'],['--accent','Actions, eyebrows'],['--accent-text','On accent']]
        .map(([v,use])=>`<div class="sw"><div class="chip2" style="background:var(${v})"></div>
          <div class="meta"><div style="font-size:12.5px;font-weight:600">${use}</div><code>${v}</code></div></div>`).join('')}
    </div>
    <hr class="rule">
    <div class="label">Semantic — derived, never themed directly</div>
    <div class="swatches">
      ${[['--correct','Correct'],['--wrong','Wrong'],['--pending','Unanswered']]
        .map(([v,use])=>`<div class="sw"><div class="chip2" style="background:var(${v})"></div>
          <div class="meta"><div style="font-size:12.5px;font-weight:600">${use}</div><code>${v}</code></div></div>`).join('')}
    </div>
    <div class="note">Status is never colour alone. A filled circle means correct, a rotated square means wrong, an outline means unanswered — and each carries a word.</div>
    <div class="gcard" style="max-width:420px">
      <span class="status ok">Correct</span> &nbsp;
      <span class="status bad">Wrong</span> &nbsp;
      <span class="status wait">Waiting</span>

/* ============================ wiring ============================ */
const keys = Object.keys(S);
let cur = keys[0], far = false;

const nav = document.getElementById('nav');
let lastGroup = null;
nav.innerHTML = keys.map(k => {
  const g = S[k].group !== lastGroup ? `<div class="grp">${S[k].group}</div>` : '';
  lastGroup = S[k].group;
  return g + `<button class="nav" data-k="${k}">${S[k].label}</button>`;
}).join('');

function render(){
  const s = S[cur];
  document.getElementById('title').textContent = s.title;
  document.getElementById('blurb').textContent = s.blurb;
  document.getElementById('stage').innerHTML = s.render();
  document.querySelectorAll('.nav').forEach(b => b.setAttribute('aria-current', b.dataset.k === cur));
  const bs = document.getElementById('bs');
  if (bs) bs.classList.toggle('far', far);
  document.getElementById('tFar').setAttribute('aria-pressed', far);
}
nav.addEventListener('click', e => {
  const b = e.target.closest('.nav'); if(!b) return;
  cur = b.dataset.k; render(); window.scrollTo({top:0});
});
document.getElementById('tTheme').addEventListener('click', e => {
  const light = document.documentElement.dataset.theme === 'light';
  document.documentElement.dataset.theme = light ? 'dark' : 'light';
  e.currentTarget.setAttribute('aria-pressed', String(!light));
  e.currentTarget.textContent = light ? 'Light theme' : 'Dark theme';
});
document.getElementById('tFar').addEventListener('click', () => { far = !far; render(); });
render();
</script>
